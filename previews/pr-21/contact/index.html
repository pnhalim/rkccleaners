<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact RKC Cleaners about commercial cleaning in the greater Chicago area."
    />
    <title>Contact | RKC Cleaners</title>
    <link rel="icon" type="image/svg+xml" href="/rkccleaners/previews/pr-21/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/rkccleaners/previews/pr-21/assets/index-CWCPZdmP.js"></script>
    <link rel="modulepreload" crossorigin href="/rkccleaners/previews/pr-21/assets/style-CoPEd_QF.js">
    <link rel="modulepreload" crossorigin href="/rkccleaners/previews/pr-21/assets/header-menu-CslBhzaI.js">
    <link rel="stylesheet" crossorigin href="/rkccleaners/previews/pr-21/assets/style-CZIVD_yP.css">
  </head>
  <body class="landing-page contact-page font-body text-ink antialiased">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="../">RKC<span>CLEANERS</span></a>
      <button
        class="header-menu"
        type="button"
        aria-expanded="false"
        aria-controls="primary-navigation"
      >
        <span class="header-menu-label">Menu</span>
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path class="menu-icon" d="M4 7h16M4 12h16M4 17h16" />
          <path class="close-icon" d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
      <nav
        id="primary-navigation"
        class="header-links"
        aria-label="Main navigation"
      >
        <a class="text-link header-nav" href="../#services">Services</a>
        <a class="text-link header-nav" href="../#why-us">About</a>
        <a class="text-link header-nav" href="../reviews/">Reviews</a>
        <a class="text-link header-nav" href="./" aria-current="page"
          >Contact us</a
        >
      </nav>
    </header>
    <main id="main">
      <section
        class="content-section contact-section"
        aria-labelledby="contact-title"
      >
        <div class="section-inner contact-layout">
          <header class="section-heading">
            <p class="section-eyebrow">Get in touch</p>
            <h1 id="contact-title">Let's talk.</h1>
            <p>
              Tell us about your business and what you need cleaned. We'll get
              back to you soon.
            </p>
          </header>

          <!-- Web3Forms access keys are public by design; restrict allowed domains in the Web3Forms dashboard. -->
          <form
            id="contact-form"
            class="contact-form"
            action="https://api.web3forms.com/submit"
            method="POST"
          >
            <input
              type="hidden"
              name="access_key"
              value="7ac83a51-cf1e-44a8-bbcf-2ca913540f2a"
            />
            <input
              type="hidden"
              name="subject"
              value="New message from the RKC Cleaners website"
            />
            <input
              type="hidden"
              name="from_name"
              value="RKC Cleaners website"
            />
            <input
              type="checkbox"
              name="botcheck"
              class="hidden"
              tabindex="-1"
              autocomplete="off"
            />

            <label class="contact-field">
              Name
              <input type="text" name="name" autocomplete="name" required />
            </label>
            <label class="contact-field">
              Email
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label class="contact-field">
              <span
                >Phone <span class="contact-optional">(optional)</span></span
              >
              <input type="tel" name="phone" autocomplete="tel" />
            </label>
            <label class="contact-field">
              Message
              <textarea name="message" rows="6" required></textarea>
            </label>

            <div class="h-captcha" data-captcha="true"></div>

            <button class="contact-button" type="submit">Send message</button>
            <p id="contact-status" class="contact-status" role="status"></p>
          </form>
        </div>
      </section>
    </main>
    <script src="https://web3forms.com/client/script.js" async defer></script>
  </body>
</html>
