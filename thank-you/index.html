<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Thank you | RKC Cleaners</title>
    <link rel="icon" type="image/svg+xml" href="/rkccleaners/favicon.svg" />
    <link rel="stylesheet" crossorigin href="/rkccleaners/assets/style-BgfOIhrB.css">
  </head>
  <body class="bg-page font-body text-ink antialiased">
    <header class="mx-auto max-w-6xl px-6 py-8">
      <a class="text-xl font-semibold tracking-tight" href="../"
        >RKC Cleaners</a
      >
    </header>
    <main class="mx-auto max-w-6xl px-6">
      <section
        class="flex min-h-[50vh] flex-col items-start justify-center py-20"
        aria-labelledby="thank-you-title"
      >
        <p
          class="mb-6 text-sm font-semibold uppercase tracking-widest text-brand"
        >
          Message sent
        </p>
        <h1
          id="thank-you-title"
          class="max-w-3xl font-heading text-5xl font-semibold leading-tight tracking-tight sm:text-7xl"
        >
          Thank you.
        </h1>
        <p class="mt-6 max-w-xl text-lg leading-relaxed text-muted">
          We got your message and will get back to you soon.
        </p>
        <a
          class="mt-10 rounded-button bg-brand px-8 py-3 font-semibold text-on-brand hover:bg-brand-hover"
          href="../"
          >Back to home</a
        >
      </section>
    </main>
    <footer class="mx-auto max-w-6xl px-6 py-10 text-sm text-muted">
      RKC Cleaners
    </footer>
  </body>
</html>
