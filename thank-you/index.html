<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Thank you | RKC Cleaners</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/thank-you.js"></script>
  </head>
  <body class="landing-page contact-page font-body text-ink antialiased">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="../">RKC<span>CLEANERS</span></a>
      <button
        class="header-menu"
        type="button"
        aria-expanded="false"
        aria-controls="primary-navigation"
      >
        <span class="header-menu-label">Menu</span>
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path class="menu-icon" d="M4 7h16M4 12h16M4 17h16" />
          <path class="close-icon" d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
      <nav
        id="primary-navigation"
        class="header-links"
        aria-label="Main navigation"
      >
        <a class="text-link header-nav" href="../#services">Services</a>
        <a class="text-link header-nav" href="../#why-us">About</a>
        <a class="text-link header-nav" href="../reviews/">Reviews</a>
        <a class="text-link header-nav" href="../contact/">Contact us</a>
      </nav>
    </header>
    <main id="main">
      <section
        class="content-section contact-section"
        aria-labelledby="thank-you-title"
      >
        <div class="section-inner">
          <header class="section-heading">
            <p class="section-eyebrow">Message sent</p>
            <h1 id="thank-you-title">Thank you.</h1>
            <p>We got your message and will get back to you soon.</p>
          </header>
          <a class="contact-button" href="../">Back to home</a>
        </div>
      </section>
    </main>
  </body>
</html>
